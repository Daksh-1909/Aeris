<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" width="320" height="480" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Foreground tree, base at the bottom center (160,470). The canopy group id canopy can sway. Tint with CSS variables leaf, leaf-light, leaf-dark, trunk, trunk-dark. Inline this file in the page. -->
  <defs>
    <clipPath id="canopyClip">
      <circle cx="160" cy="150" r="95"/><circle cx="95" cy="185" r="70"/><circle cx="225" cy="185" r="72"/>
      <circle cx="160" cy="95" r="70"/><circle cx="112" cy="112" r="55"/><circle cx="212" cy="116" r="58"/>
      <circle cx="58" cy="232" r="45"/><circle cx="262" cy="236" r="45"/><circle cx="160" cy="215" r="70"/>
    </clipPath>
    <radialGradient id="leafGlow" gradientUnits="userSpaceOnUse" cx="120" cy="110" r="190">
      <stop offset="0" stop-color="var(--leaf-light,#8fd16a)" stop-opacity=".75"/>
      <stop offset="1" stop-color="var(--leaf-light,#8fd16a)" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="160" cy="470" rx="130" ry="12" fill="#000000" opacity=".22"/>
  <!-- trunk and roots -->
  <path d="M132 472 C142 410 148 340 142 240 L178 240 C172 340 178 410 190 472 C176 462 166 468 160 472 C152 468 142 462 132 472Z" fill="var(--trunk,#6b4528)"/>
  <path d="M164 250 C168 340 166 420 176 466 L190 472 C178 410 174 340 178 240Z" fill="var(--trunk-dark,#4a2f1a)" opacity=".7"/>
  <path d="M150 320 C134 304 120 290 106 268 M172 300 C192 284 208 268 224 248" stroke="var(--trunk,#6b4528)" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- canopy -->
  <g id="canopy">
    <g fill="var(--leaf,#4f9a3c)">
      <circle cx="160" cy="150" r="95"/><circle cx="95" cy="185" r="70"/><circle cx="225" cy="185" r="72"/>
      <circle cx="160" cy="95" r="70"/><circle cx="112" cy="112" r="55"/><circle cx="212" cy="116" r="58"/>
      <circle cx="58" cy="232" r="45"/><circle cx="262" cy="236" r="45"/><circle cx="160" cy="215" r="70"/>
    </g>
    <g clip-path="url(#canopyClip)">
      <ellipse cx="160" cy="300" rx="190" ry="90" fill="var(--leaf-dark,#2f6a2a)" opacity=".55"/>
      <rect x="0" y="0" width="320" height="320" fill="url(#leafGlow)"/>
    </g>
  </g>
</svg>
