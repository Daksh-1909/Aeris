<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 60" width="0" height="0" style="position:absolute" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Sprite. Use: <svg viewBox="0 0 40 60"><use href="/3d/scene/flowers.svg#daisy"/></svg>
       Tint with f1 f2 f3 (petals) and stem. Each symbol's base is at the bottom center (20,58). -->
  <defs>
    <symbol id="daisy" viewBox="0 0 40 60">
      <path d="M20 58 V26" stroke="var(--stem,#3f7a33)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
      <path d="M20 46 q-9-2-11-10 q9 0 11 10z" fill="var(--stem,#3f7a33)"/>
      <g fill="var(--f1,#ffffff)">
        <ellipse cx="20" cy="14" rx="3.6" ry="7"/><ellipse cx="20" cy="14" rx="3.6" ry="7" transform="rotate(45 20 22)"/>
        <ellipse cx="20" cy="14" rx="3.6" ry="7" transform="rotate(90 20 22)"/><ellipse cx="20" cy="14" rx="3.6" ry="7" transform="rotate(135 20 22)"/>
        <ellipse cx="20" cy="14" rx="3.6" ry="7" transform="rotate(180 20 22)"/><ellipse cx="20" cy="14" rx="3.6" ry="7" transform="rotate(225 20 22)"/>
        <ellipse cx="20" cy="14" rx="3.6" ry="7" transform="rotate(270 20 22)"/><ellipse cx="20" cy="14" rx="3.6" ry="7" transform="rotate(315 20 22)"/>
      </g>
      <circle cx="20" cy="22" r="4.6" fill="var(--f1-core,#f6c344)"/>
    </symbol>
    <symbol id="tulip" viewBox="0 0 40 60">
      <path d="M20 58 V28" stroke="var(--stem,#3f7a33)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
      <path d="M20 54 q-12-4-13-20 q11 4 13 20z" fill="var(--stem,#3f7a33)"/>
      <path d="M11 12 q0 18 9 18 t9-18 l-4.5 5 -4.5-8 -4.5 8z" fill="var(--f2,#ff7a8a)"/>
      <path d="M20 9 l-4.5 8 4.5 13 4.5-13z" fill="var(--f2-light,#ffa3ae)" opacity=".8"/>
    </symbol>
    <symbol id="bell" viewBox="0 0 40 60">
      <path d="M20 58 C20 40 18 30 22 18" stroke="var(--stem,#3f7a33)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <path d="M20 50 q10-3 12-12 q-10 0-12 12z" fill="var(--stem,#3f7a33)"/>
      <path d="M13 14 q0-9 9-9 t9 9 q0 5 3 8 H10 q3-3 3-8z" transform="rotate(10 22 14)" fill="var(--f3,#b58cff)"/>
      <circle cx="24" cy="25" r="1.8" fill="var(--f3-core,#ffe27a)"/>
