<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 420" preserveAspectRatio="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Tint with CSS variables: haze, hill, grass-back, grass-front, blade -->
  <defs>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--haze, #9fc2e8)" stop-opacity="0"/>
      <stop offset="1" stop-color="var(--haze, #9fc2e8)" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--grass-back, #8cc063)"/>
      <stop offset="1" stop-color="var(--grass-mid, #6aa04a)"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--grass-mid, #5f9644)"/>
      <stop offset="1" stop-color="var(--grass-front, #3f7a33)"/>
    </linearGradient>
    <pattern id="blades" width="46" height="26" patternUnits="userSpaceOnUse">
      <path d="M6 24l2-10M10 24l-1-13M14 24l3-9M30 22l1-9M34 22l-2-11M38 22l3-8" stroke="var(--blade, #2f6428)" stroke-width="1.4" stroke-linecap="round" opacity=".35" fill="none"/>
    </pattern>
  </defs>

  <!-- very low far hills (kept subtle so the sun still rises from a plain surface) -->
  <path d="M0 118 C160 96 300 108 460 100 S760 92 940 104 S1260 96 1440 108 V200 H0Z" fill="var(--hill, #7fa7b5)" opacity=".6"/>
  <rect y="96" width="1440" height="110" fill="url(#haze)"/>

  <!-- back grass band: the horizon the sun rises from -->
  <path d="M0 128 C220 120 420 132 700 126 S1160 120 1440 128 V420 H0Z" fill="url(#back)"/>
  <!-- front grass band -->
  <path d="M0 214 C240 202 470 222 720 212 S1180 200 1440 214 V420 H0Z" fill="url(#front)"/>

  <!-- texture: sparse blades, heavier toward the viewer -->
  <rect y="214" width="1440" height="206" fill="url(#blades)" opacity=".9"/>
  <rect y="150" width="1440" height="64" fill="url(#blades)" opacity=".4"/>
</svg>
