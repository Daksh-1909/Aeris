<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Static cloud: Cumulus (puffy). Tint with cloud-top, cloud-bottom, cloud-shade, face. Used as the reduced-motion and no-JS fallback. -->
  <defs>
    <linearGradient id="cloudBody" gradientUnits="userSpaceOnUse" x1="0" y1="20" x2="0" y2="215"><stop offset="0" stop-color="var(--cloud-top,#ffffff)"/><stop offset="1" stop-color="var(--cloud-bottom,#cfd9f2)"/></linearGradient>
    <clipPath id="cloudClip"><circle cx="95" cy="160" r="48"/><circle cx="150" cy="115" r="58"/><circle cx="215" cy="90" r="68"/><circle cx="275" cy="125" r="55"/><circle cx="310" cy="165" r="46"/><circle cx="170" cy="175" r="45"/><circle cx="250" cy="178" r="45"/><rect x="70" y="150" width="260" height="64" rx="32"/></clipPath>
  </defs>
  <ellipse cx="200" cy="236" rx="120" ry="8" fill="#000" opacity=".12"/>
  <g fill="url(#cloudBody)"><circle cx="95" cy="160" r="48"/><circle cx="150" cy="115" r="58"/><circle cx="215" cy="90" r="68"/><circle cx="275" cy="125" r="55"/><circle cx="310" cy="165" r="46"/><circle cx="170" cy="175" r="45"/><circle cx="250" cy="178" r="45"/><rect x="70" y="150" width="260" height="64" rx="32"/></g>
  <g clip-path="url(#cloudClip)"><ellipse cx="200" cy="232" rx="220" ry="46" fill="var(--cloud-shade,#9fb0d6)" opacity=".35"/></g>
  <g fill="var(--face,#2b3350)"><ellipse cx="169" cy="149" rx="9" ry="9.00"/><ellipse cx="241" cy="149" rx="9" ry="9.00"/></g><path d="M 177.0 179 Q 205 193 233.0 179" fill="none" stroke="var(--face,#2b3350)" stroke-width="4.5" stroke-linecap="round"/>
</svg>
