<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Static cloud: Comet cloud (tail to the left). Tint with cloud-top, cloud-bottom, cloud-shade, face. Used as the reduced-motion and no-JS fallback. -->
  <defs>
    <linearGradient id="cloudBody" gradientUnits="userSpaceOnUse" x1="0" y1="20" x2="0" y2="215"><stop offset="0" stop-color="var(--cloud-top,#ffffff)"/><stop offset="1" stop-color="var(--cloud-bottom,#cfd9f2)"/></linearGradient>
    <clipPath id="cloudClip"><circle cx="70" cy="192" r="18"/><circle cx="110" cy="180" r="26"/><circle cx="165" cy="160" r="36"/><circle cx="290" cy="130" r="48"/><circle cx="335" cy="170" r="34"/><circle cx="230" cy="160" r="34"/><circle cx="265" cy="185" r="32"/><rect x="130" y="165" width="200" height="44" rx="22"/></clipPath>
  </defs>
  <ellipse cx="200" cy="236" rx="120" ry="8" fill="#000" opacity=".12"/>
  <g fill="url(#cloudBody)"><circle cx="70" cy="192" r="18"/><circle cx="110" cy="180" r="26"/><circle cx="165" cy="160" r="36"/><circle cx="290" cy="130" r="48"/><circle cx="335" cy="170" r="34"/><circle cx="230" cy="160" r="34"/><circle cx="265" cy="185" r="32"/><rect x="130" y="165" width="200" height="44" rx="22"/></g>
  <g clip-path="url(#cloudClip)"><ellipse cx="200" cy="232" rx="220" ry="46" fill="var(--cloud-shade,#9fb0d6)" opacity=".35"/></g>
  <g fill="var(--face,#2b3350)"><ellipse cx="255" cy="148" rx="8" ry="8.00"/><ellipse cx="315" cy="148" rx="8" ry="8.00"/></g><path d="M 263.0 176 Q 285 190 307.0 176" fill="none" stroke="var(--face,#2b3350)" stroke-width="4.5" stroke-linecap="round"/>
</svg>
