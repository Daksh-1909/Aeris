<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 120" width="330" height="120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Bird sprite with three wing frames. Works two ways: (1) open it to see the frames, (2) use one frame with the use element, for example href=/3d/scene/birds.svg#bird-up inside an svg with viewBox 0 0 44 24. Flap by swapping up, mid, down, mid about every 120 ms. Tint with the CSS variable bird. -->
  <defs>
    <symbol id="bird-up" viewBox="0 0 44 24">
      <path d="M22 14 Q14 -2 0 2 Q14 8 22 14 Q30 8 44 2 Q30 -2 22 14Z" fill="var(--bird,#2a2438)"/>
      <ellipse cx="22" cy="14" rx="6" ry="3.4" fill="var(--bird,#2a2438)"/>
    </symbol>
    <symbol id="bird-mid" viewBox="0 0 44 24">
      <path d="M22 12 Q12 8 0 12 Q12 15 22 14 Q32 15 44 12 Q32 8 22 12Z" fill="var(--bird,#2a2438)"/>
      <ellipse cx="22" cy="13" rx="6" ry="3.4" fill="var(--bird,#2a2438)"/>
    </symbol>
    <symbol id="bird-down" viewBox="0 0 44 24">
      <path d="M22 10 Q12 16 2 24 Q16 18 22 14 Q28 18 42 24 Q32 16 22 10Z" fill="var(--bird,#2a2438)"/>
      <ellipse cx="22" cy="11" rx="6" ry="3.4" fill="var(--bird,#2a2438)"/>
    </symbol>
  </defs>
  <rect width="330" height="120" rx="12" fill="#f4b58a"/>
  <use href="#bird-up" x="20" y="24" width="88" height="48"/>
  <use href="#bird-mid" x="121" y="24" width="88" height="48"/>
  <use href="#bird-down" x="222" y="24" width="88" height="48"/>
  <g font-family="sans-serif" font-size="12" fill="#2a2438" text-anchor="middle">
    <text x="64" y="104">bird-up</text><text x="165" y="104">bird-mid</text><text x="266" y="104">bird-down</text>
  </g>
</svg>
