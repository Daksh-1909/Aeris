<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" width="300" height="120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Four children playing, base line at y=110. Groups: kid1 (jumping), kid2 (running), kid3 (kicking, the ball has id ball), kid4 (holding a kite, group id kite). Tint with CSS variables kids, ball, kite. Inline this file in the page. -->
  <g id="kid1" stroke="var(--kids,#2a1222)" stroke-linecap="round" fill="none">
    <circle cx="40" cy="38" r="8" fill="var(--kids,#2a1222)" stroke="none"/>
    <path d="M40 50 V72" stroke-width="11"/>
    <path d="M40 54 L24 36 M40 54 L56 34" stroke-width="5"/>
    <path d="M40 72 L30 92 M40 72 L52 90" stroke-width="6"/>
  </g>
  <g id="kid2" stroke="var(--kids,#2a1222)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="120" cy="42" r="8" fill="var(--kids,#2a1222)" stroke="none"/>
    <path d="M116 54 L104 78" stroke-width="11"/>
    <path d="M114 58 L130 66 M114 58 L98 64" stroke-width="5"/>
    <path d="M104 78 L120 92 L124 110 M104 78 L90 92 L82 106" stroke-width="6"/>
  </g>
  <g id="kid3" stroke="var(--kids,#2a1222)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="175" cy="44" r="8" fill="var(--kids,#2a1222)" stroke="none"/>
    <path d="M175 56 V80" stroke-width="11"/>
    <path d="M175 60 L158 70 M175 60 L193 66" stroke-width="5"/>
    <path d="M175 80 L172 110 M175 80 L194 94 L205 100" stroke-width="6"/>
    <circle id="ball" cx="217" cy="104" r="7" fill="var(--ball,#ffd37a)" stroke="none"/>
  </g>
  <g id="kid4" stroke="var(--kids,#2a1222)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="250" cy="50" r="8" fill="var(--kids,#2a1222)" stroke="none"/>
    <path d="M250 62 V84" stroke-width="11"/>
    <path d="M250 66 L266 52 M250 66 L240 80" stroke-width="5"/>
    <path d="M250 84 L242 110 M250 84 L260 110" stroke-width="6"/>
    <g id="kite">
      <path d="M266 52 Q272 30 282 14" stroke-width="1.5" stroke="var(--kids,#2a1222)"/>
      <path d="M282 2 L292 14 L282 30 L272 14Z" fill="var(--kite,#ff6a5a)" stroke="none"/>
      <path d="M282 30 q-6 6 0 11 t0 11" stroke-width="1.8" stroke="var(--kite,#ff6a5a)"/>
    </g>
  </g>
</svg>
