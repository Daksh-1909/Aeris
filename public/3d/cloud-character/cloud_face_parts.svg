<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 300 120" width="300" height="120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Face parts. Works two ways: (1) open it to see the parts, (2) use one part with <use href="/3d/cloud-character/cloud_face_parts.svg#tear"/>. Tint with CSS variables tear, zzz, blush. -->
  <defs>
    <symbol id="tear" viewBox="0 0 12 18"><path d="M6 1 C6 1 1 8 1 12 a5 5 0 0 0 10 0 C11 8 6 1 6 1z" fill="var(--tear,#6fc3ff)" stroke="#ffffff" stroke-opacity=".6" stroke-width="1"/></symbol>
    <symbol id="z" viewBox="0 0 16 18"><path d="M2 2h12L2 16h12" fill="none" stroke="var(--zzz,#ffffff)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="blush" viewBox="0 0 24 12"><ellipse cx="12" cy="6" rx="10" ry="5" fill="var(--blush,#ff9db1)" opacity=".6"/></symbol>
  </defs>
  <rect width="300" height="120" rx="12" fill="#16204a"/>
  <use href="#tear" x="30" y="20" width="36" height="54"/>
  <use href="#z" x="120" y="30" width="40" height="45"/>
  <use href="#z" x="170" y="14" width="56" height="63"/>
  <use href="#blush" x="236" y="36" width="48" height="24"/>
  <g font-family="sans-serif" font-size="12" fill="#cfe0ff" text-anchor="middle">
    <text x="48" y="100">tear</text><text x="170" y="100">z (small and large)</text><text x="260" y="100">blush</text>
  </g>
</svg>
