<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Static cloud: Stratus (wide, flat). Tint with cloud-top, cloud-bottom, cloud-shade, face. Used as the reduced-motion and no-JS fallback. -->
  <defs>
    <linearGradient id="cloudBody" gradientUnits="userSpaceOnUse" x1="0" y1="20" x2="0" y2="215"><stop offset="0" stop-color="var(--cloud-top,#ffffff)"/><stop offset="1" stop-color="var(--cloud-bottom,#cfd9f2)"/></linearGradient>
    <clipPath id="cloudClip"><circle cx="60" cy="175" r="32"/><circle cx="120" cy="145" r="38"/><circle cx="200" cy="130" r="44"/><circle cx="280" cy="145" r="38"/><circle cx="345" cy="172" r="32"/><circle cx="160" cy="175" r="34"/><circle cx="240" cy="176" r="34"/><rect x="30" y="150" width="340" height="56" rx="28"/></clipPath>
  </defs>
  <ellipse cx="200" cy="236" rx="120" ry="8" fill="#000" opacity=".12"/>
  <g fill="url(#cloudBody)"><circle cx="60" cy="175" r="32"/><circle cx="120" cy="145" r="38"/><circle cx="200" cy="130" r="44"/><circle cx="280" cy="145" r="38"/><circle cx="345" cy="172" r="32"/><circle cx="160" cy="175" r="34"/><circle cx="240" cy="176" r="34"/><rect x="30" y="150" width="340" height="56" rx="28"/></g>
  <g clip-path="url(#cloudClip)"><ellipse cx="200" cy="232" rx="220" ry="46" fill="var(--cloud-shade,#9fb0d6)" opacity=".35"/></g>
  <g fill="var(--face,#2b3350)"><ellipse cx="160" cy="160" rx="8.5" ry="8.50"/><ellipse cx="240" cy="160" rx="8.5" ry="8.50"/></g><path d="M 172.0 187 Q 200 201 228.0 187" fill="none" stroke="var(--face,#2b3350)" stroke-width="4.5" stroke-linecap="round"/>
</svg>
