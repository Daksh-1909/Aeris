<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Static cloud: Cumulonimbus tower (tall). Tint with cloud-top, cloud-bottom, cloud-shade, face. Used as the reduced-motion and no-JS fallback. -->
  <defs>
    <linearGradient id="cloudBody" gradientUnits="userSpaceOnUse" x1="0" y1="20" x2="0" y2="215"><stop offset="0" stop-color="var(--cloud-top,#ffffff)"/><stop offset="1" stop-color="var(--cloud-bottom,#cfd9f2)"/></linearGradient>
    <clipPath id="cloudClip"><circle cx="130" cy="185" r="30"/><circle cx="150" cy="130" r="46"/><circle cx="205" cy="75" r="62"/><circle cx="255" cy="135" r="46"/><circle cx="275" cy="185" r="30"/><circle cx="205" cy="150" r="52"/><circle cx="205" cy="105" r="52"/><rect x="110" y="170" width="180" height="48" rx="24"/></clipPath>
  </defs>
  <ellipse cx="200" cy="236" rx="120" ry="8" fill="#000" opacity=".12"/>
  <g fill="url(#cloudBody)"><circle cx="130" cy="185" r="30"/><circle cx="150" cy="130" r="46"/><circle cx="205" cy="75" r="62"/><circle cx="255" cy="135" r="46"/><circle cx="275" cy="185" r="30"/><circle cx="205" cy="150" r="52"/><circle cx="205" cy="105" r="52"/><rect x="110" y="170" width="180" height="48" rx="24"/></g>
  <g clip-path="url(#cloudClip)"><ellipse cx="200" cy="232" rx="220" ry="46" fill="var(--cloud-shade,#9fb0d6)" opacity=".35"/></g>
  <g fill="var(--face,#2b3350)"><ellipse cx="175" cy="134" rx="8.5" ry="8.50"/><ellipse cx="235" cy="134" rx="8.5" ry="8.50"/></g><path d="M 181.0 164 Q 205 178 229.0 164" fill="none" stroke="var(--face,#2b3350)" stroke-width="4.5" stroke-linecap="round"/>
</svg>
