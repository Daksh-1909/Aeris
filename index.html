    <script>try{const r=document.documentElement,m=localStorage.getItem('aeris:sky-mode'),h=new Date().getHours(),s=h<5?'night':h<7?'dawn':h<16?'day':h<19?'golden':h<21?'dusk':'night';r.dataset.skyState=m==='day'||m==='night'?m:s;const a=localStorage.getItem('aeris:appearance'),d=a==='daylight'||(a!=='dusk'&&matchMedia('(prefers-color-scheme: light)').matches);r.dataset.theme=d?'daylight':'dusk';const c=document.querySelector('meta[name="theme-color"]');if(c)c.content=d?'#F4F8F6':'#0B1A24'}catch{document.documentElement.dataset.skyState='day';document.documentElement.dataset.theme='dusk'}</script>
